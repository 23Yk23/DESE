<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESE - Admin Panel</title>
    
    <link rel="stylesheet" href="css/style.css"> <link rel="stylesheet" href="css/main.css"> <link rel="stylesheet" href="css/admin.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="auth-pending"> <header>
        <nav class="navbar">
            <a href="index.html" class="logo">DESE</a>
            <a href="index.html" class="btn-create" style="background-color: #17a2b8;">
                <i class="fas fa-home"></i> Ana Sayfaya Dön
            </a>
            <span id="user-email" style="margin-left: auto; margin-right: 1rem; color: #555;"></span>
            <a href="#" class="btn-logout" id="btn-logout">Çıkış Yap</a>
        </nav>
    </header>


       <div class="container">
        <main class="main-content" style="flex-basis: 100%;"> <h2>Admin Panel</h2>
            <p>Bu sayfa sadece 'admin' rolüne sahip kullanıcılar tarafından görülebilir.</p>
            
            <div class="sidebar-widget user-management-widget">
                <h3>Kullanıcı Yönetimi</h3>
                
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>İsim Soyisim</th>
                            <th>E-Posta</th>
                            <th>Rolü</th>
                            <th>Rolü Değiştir</th>


                        </tr>
                    </thead>
                    <tbody id="user-list-body">
                        </tbody>
                </table>
                
                <div id="user-table-status">Yükleniyor...</div>

            </div>
            <div class="sidebar-widget feedback-management-widget" style="margin-top: 2rem;">
                <h3>Gelen Geri Bildirimler</h3>
                
                <table class="user-table feedback-table">
                    <thead>
                        <tr>
                            <th>Tarih</th>
                            <th>Gönderen</th>
                            <th>Tür</th>
                            <th class="feedback-message-column">Mesaj</th>
                            <th>Durum</th>
                            <th>Eylemler</th> </tr>
                    </thead>
                    <tbody id="feedback-list-body">
                        </tbody>
                </table>
                
                <div id="feedback-table-status" class="user-table-status">Yükleniyor...</div>

            </div>

        </main>
    </div>
    
    <script type="module" src="js/admin.js"></script>
</body>
</html>
